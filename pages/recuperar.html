<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña | VoluntariApp</title>

    <link rel="stylesheet" href="../css/recuperar.css">
</head>

<body>

    <div class="auth-left"></div>

    <div class="auth-right">
        <div class="form-container">
            <div class="logo-container">
                <img src="../images/logo.png" alt="VoluntariApp Logo">
            </div>

            <h1>Recuperar contraseña</h1>
            <p>Ingresa tu correo electrónico y te enviaremos las instrucciones para restablecerla.</p>

            <form id="recovery-form">
                <label for="email">Correo electrónico</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="tu@correo.com"
                    required
                >

                <button type="submit" id="boton-enviar">
                    Enviar instrucciones <span aria-hidden="true">→</span>
                </button>

                <p id="recovery-ok" hidden style="margin-top:12px;font-size:14px;font-weight:700;color:#145E48;background:#E1EEE8;border-radius:8px;padding:10px 14px;"></p>
            </form>

            <script>
                document.getElementById('recovery-form').addEventListener('submit', function (e) {
                    e.preventDefault();
                    var email = document.getElementById('email').value.trim();
                    if (!email) return;
                    var btn = document.getElementById('boton-enviar');
                    btn.disabled = true;
                    btn.textContent = 'Enviando...';
                    setTimeout(function () {
                        var ok = document.getElementById('recovery-ok');
                        ok.textContent = 'Te enviamos las instrucciones a ' + email + '. Revisa tu bandeja.';
                        ok.hidden = false;
                        btn.textContent = 'Enviado ✓';
                        setTimeout(function () { window.location.href = 'login.html'; }, 2000);
                    }, 800);
                });
            </script>

            <div class="back-to-login">
                <a href="login.html">← Volver al inicio de sesión</a>
            </div>
        </div>
    </div>

</body>

</html>
