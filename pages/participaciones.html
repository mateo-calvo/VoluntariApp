<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis participaciones | VoluntariApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/panel.css">
  <style>
    .filter-btn {
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 13.5px;
      font-weight: 600;
      border: 1px solid var(--color-border-soft, #e2e8f0);
      background: #ffffff;
      color: var(--color-navy, #1e293b);
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .filter-btn:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }
    .filter-btn.active {
      background: var(--color-green, #1A7A5E);
      color: #ffffff;
      border-color: var(--color-green, #1A7A5E);
      box-shadow: 0 2px 6px rgba(26, 122, 94, 0.25);
    }
  </style>
</head>
<body>
  <header class="navbar-background">
    <nav class="panel-navbar">
      <a href="../index.html" class="logo" title="Volver al inicio">
        <img src="../images/logo.png" alt="VoluntariApp">
      </a>
      <ul class="nav-links">
        <li><a href="mapa.html">Mapa</a></li>
        <li><a href="#" class="active-link">Mis participaciones</a></li>
      </ul>
      <div class="panel-user">
        <div class="user-chip"><span class="avatar" id="user-avatar">V</span><span class="username" id="user-name"></span></div>
        <a href="#" class="logout-link" id="logout-link">Salir</a>
      </div>
    </nav>
  </header>

  <main class="panel-main">
    <h1 class="panel-title">Mis participaciones</h1>
    <p class="panel-subtitle">Convocatorias en las que te anotaste como voluntario.</p>

    <!-- Filtros de estado -->
    <div class="panel-filters" id="status-filters" style="display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 20px 0;">
      <button class="filter-btn active" data-filtro="participando" type="button">Participando</button>
      <button class="filter-btn" data-filtro="finalizada" type="button">Finalizadas</button>
      <button class="filter-btn" data-filtro="cancelada" type="button">Canceladas</button>
      <button class="filter-btn" data-filtro="todas" type="button">Todas</button>
    </div>

    <p class="form-error hidden" id="panel-error" role="alert"></p>
    <p class="form-success hidden" id="panel-ok" role="status"></p>

    <section class="panel-section">
      <div class="card-list" id="parts-list"></div>
      <div class="empty hidden" id="parts-empty">
        Todavía no participás en ninguna convocatoria.
        <br>
        <a href="mapa.html" class="btn btn-primary">Explorar el mapa</a>
      </div>
    </section>
  </main>

  <script src="../js/config.js"></script>
  <script src="participaciones.js?v=5"></script>
</body>
</html>
