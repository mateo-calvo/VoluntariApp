<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis participaciones | VoluntariApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/panel.css">
  <style>
    .filter-btn {
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 13.5px;
      font-weight: 600;
      border: 1px solid var(--color-border-soft, #e2e8f0);
      background: #ffffff;
      color: var(--color-navy, #1e293b);
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .filter-btn:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }
    .filter-btn.active {
      background: var(--color-green, #1A7A5E);
      color: #ffffff;
      border-color: var(--color-green, #1A7A5E);
      box-shadow: 0 2px 6px rgba(26, 122, 94, 0.25);
    }
    .filtros-search-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      background: var(--color-white);
      padding: 12px 16px;
      border-radius: var(--radius-md, 8px);
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-sm);
      margin-bottom: 20px;
    }
    .filtros-search-bar .search-field {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1 1 240px;
    }
    .filtros-search-bar .filter-field {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .filtros-search-bar label {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--color-navy);
      white-space: nowrap;
    }
    .filtros-search-bar input[type="text"],
    .filtros-search-bar input[type="date"],
    .filtros-search-bar select {
      padding: 7px 12px;
      border-radius: 6px;
      border: 1px solid var(--color-border);
      font-size: 13.5px;
      outline: none;
      background: #fff;
      font-family: inherit;
      color: #1e293b;
      transition: border-color 0.15s ease;
    }
    .filtros-search-bar input[type="text"]:focus,
    .filtros-search-bar input[type="date"]:focus,
    .filtros-search-bar select:focus {
      border-color: var(--color-green, #1A7A5E);
    }
    .filtros-search-bar input[type="text"] {
      width: 100%;
    }
    .btn-clear-date {
      background: #f1f5f9;
      border: 1px solid var(--color-border);
      color: var(--color-muted);
      cursor: pointer;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: bold;
      line-height: 1;
      padding: 0;
      transition: all 0.15s ease;
    }
    .btn-clear-date:hover {
      background: #e2e8f0;
      color: var(--color-navy);
    }
    .btn-clear-date.hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <header class="navbar-background">
    <nav class="panel-navbar">
      <a href="../index.html" class="logo" title="Volver al inicio">
        <img src="../images/logo.png" alt="VoluntariApp">
      </a>
      <ul class="nav-links">
        <li><a href="mapa.html">Mapa</a></li>
        <li><a href="#" class="active-link">Mis participaciones</a></li>
      </ul>
      <div class="panel-user">
        <div class="user-chip"><span class="avatar" id="user-avatar">V</span><span class="username" id="user-name"></span></div>
        <a href="#" class="logout-link" id="logout-link">Salir</a>
      </div>
    </nav>
  </header>

  <main class="panel-main">
    <h1 class="panel-title">Mis participaciones</h1>
    <p class="panel-subtitle">Convocatorias en las que te anotaste como voluntario.</p>

    <!-- Filtros de estado -->
    <div class="panel-filters" id="status-filters" style="display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 16px 0;">
      <button class="filter-btn active" data-filtro="participando" type="button">Participando</button>
      <button class="filter-btn" data-filtro="finalizada" type="button">Asistidas</button>
      <button class="filter-btn" data-filtro="cancelada" type="button">Canceladas</button>
      <button class="filter-btn" data-filtro="todas" type="button">Todas</button>
    </div>

    <!-- Barra de búsqueda, filtro por fecha y orden cronológico -->
    <div class="filtros-search-bar" role="search" aria-label="Buscar y filtrar participaciones">
      <div class="search-field">
        <label for="filtro-nombre">🔍 Buscar:</label>
        <input type="text" id="filtro-nombre" placeholder="Por nombre u organización..." autocomplete="off">
      </div>
      <div class="filter-field">
        <label for="filtro-fecha">📅 Fecha:</label>
        <input type="date" id="filtro-fecha" aria-label="Filtrar por fecha del voluntariado">
        <button type="button" id="btn-limpiar-fecha" class="btn-clear-date hidden" title="Limpiar filtro de fecha" aria-label="Limpiar fecha">&times;</button>
      </div>
      <div class="filter-field">
        <label for="filtro-causa">🏷️ Causa:</label>
        <select id="filtro-causa" aria-label="Filtrar por causa">
          <option value="">Todas las causas</option>
        </select>
      </div>
      <div class="filter-field">
        <label for="filtro-orden">⇅ Ordenar:</label>
        <select id="filtro-orden" aria-label="Ordenar participaciones">
          <option value="fecha-asc">Fecha (más próximas)</option>
          <option value="fecha-desc">Fecha (más lejanas)</option>
          <option value="alfabetico">Nombre (A - Z)</option>
        </select>
      </div>
    </div>

    <p class="form-error hidden" id="panel-error" role="alert"></p>
    <p class="form-success hidden" id="panel-ok" role="status"></p>

    <section class="panel-section">
      <div class="card-list" id="parts-list"></div>
      <div class="empty hidden" id="parts-empty">
        Todavía no participás en ninguna convocatoria.
        <br>
        <a href="mapa.html" class="btn btn-primary">Explorar el mapa</a>
      </div>
    </section>
  </main>

  <script src="../js/config.js"></script>
  <script src="participaciones.js"></script>
</body>
</html>
